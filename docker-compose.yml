services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: doorway
      POSTGRES_PASSWORD: doorway
      POSTGRES_DB: doorway
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doorway"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://doorway:doorway@db:5432/doorway
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-not-for-production}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
