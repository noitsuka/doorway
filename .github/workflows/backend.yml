name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: doorway
          POSTGRES_PASSWORD: doorway
          POSTGRES_DB: doorway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U doorway"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://doorway:doorway@localhost:5432/doorway
      JWT_SECRET: ci-secret-with-at-least-thirty-two-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - name: migrations
        run: alembic upgrade head && alembic check && alembic downgrade base
      - run: pytest -q
